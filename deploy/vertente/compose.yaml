# Static publisher only. Independent project/origin, NO database or backend network.
name: ${VA_PROJECT:?Projeto novo exclusivo do publicador}
services:
  consultation:
    image: nginxinc/nginx-unprivileged:1.28-alpine@sha256:7377697a821c131a924a7105fafbe7414db4e9fcc77a6f08f776f33f141ec3f8
    entrypoint: []
    command: [nginx, -g, "daemon off;"]
    user: "101:101"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    ports:
      - "${VA_BIND_IP:?IPv4 LAN específica aprovada}:${VA_HTTPS_PORT:-8444}:8444"
    volumes:
      - ${VA_SOURCE_ROOT:?Código revisto}/vertente:/srv/vertente:ro
      - ${VA_PRIVATE_ROOT:?Pasta privada separada}/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${VA_PRIVATE_ROOT:?Pasta privada separada}/tls:/run/tls:ro
      - ${VA_PRIVATE_ROOT:?Pasta privada separada}/clients.conf:/etc/nginx/clients.conf:ro
    networks: [publisher]
    restart: "no"
networks:
  publisher: {}
