[project]
name = "gestao-garrafas"
version = "0.1.0"
description = "Gestão de Garrafas — aplicação web e histórico auditável"
requires-python = ">=3.12,<3.14"
dependencies = [
  "Django>=5.2,<5.3",
  "psycopg[binary]>=3.2,<4",
  "openpyxl>=3.1.5,<3.2",
  "python-dotenv>=1.1,<2",
  "gunicorn>=23,<24",
  "whitenoise>=6.9,<7",
  "reportlab>=4.4,<5",
  "pillow>=11.3,<13",
  "cryptography>=46,<47",
]

[dependency-groups]
dev = [
    "ruff>=0.12,<1",
    "playwright>=1.55,<2",
    "pypdf>=6,<7",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
