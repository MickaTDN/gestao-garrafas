{% if page_obj.paginator.num_pages > 1 %}
<nav class="row between pagination" aria-label="Paginação">
  {% if page_obj.has_previous %}<a class="btn secondary small" href="?{{ query_string }}&amp;page={{ page_obj.previous_page_number }}">Anterior</a>{% else %}<span></span>{% endif %}
  <span>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a class="btn secondary small" href="?{{ query_string }}&amp;page={{ page_obj.next_page_number }}">Seguinte</a>{% else %}<span></span>{% endif %}
</nav>
{% endif %}
