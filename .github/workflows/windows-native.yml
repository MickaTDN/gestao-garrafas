name: Native Windows installer
on:
  push:
    branches: [main, stagec/windows-native-installer]
  pull_request:
  workflow_dispatch:
concurrency:
  group: native-windows-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows-native-synthetic:
    name: windows-native-synthetic
    # Forks run the non-privileged regression workflows, never service/ACL setup.
    if: >-
      github.repository == 'MickaTDN/gestao-garrafas' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Install pinned uv tool
        run: python -m pip install uv==0.12.23
      - name: Install locked Python dependencies
        run: uv sync --frozen
      - name: Synthetic VM demo and encrypted recovery kit regressions (no installation)
        run: dotnet run --project tests/native_windows/DemoTests/DemoTests.csproj --configuration Release
      - name: Install pinned NSIS compiler
        run: choco install nsis --version=3.11 --yes --no-progress
      - name: Native updater and Windows encoding regression tests (no installation)
        run: uv run python tests/native_windows/run_unit_tests.py
      - name: Real NTFS and virtual-service ACL safeguards (fresh synthetic files)
        run: uv run python tests/native_windows/acl_probe.py
      - name: Fetch synthetic vendor inputs (never release trust)
        shell: powershell
        run: .\scripts\native\Prepare-TestInputs.ps1 -Directory "$env:RUNNER_TEMP\gva-native"
      - name: Synthetic signing authority (private key never uploaded)
        shell: pwsh
        run: |
          @'
          import json, os
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import ec
          root=Path(os.environ['RUNNER_TEMP'])/'gva-native'
          key=ec.generate_private_key(ec.SECP256R1())
          (root/'signing.pem').write_bytes(key.private_bytes(serialization.Encoding.PEM,serialization.PrivateFormat.PKCS8,serialization.NoEncryption()))
          (root/'policy.json').write_text(json.dumps({'channel':'synthetic','authenticode_sha256':None,'public_key':key.public_key().public_bytes(serialization.Encoding.PEM,serialization.PublicFormat.SubjectPublicKeyInfo).decode()}))
          '@ | uv run python -
      - name: Build initial and update packages; compile installer EXEs
        shell: pwsh
        run: |
          $root="$env:RUNNER_TEMP\gva-native"
          foreach ($version in @('1.0.0','1.1.0')) {
            $probe = @()
            if ($version -eq '1.1.0') { $probe = @('--synthetic-migration-probe') }
            uv run python scripts/native/build_package.py --version $version --minimum-version 1.0.0 --policy "$root\policy.json" --key "$root\signing.pem" --inputs "$root\inputs.json" --output "$root\package-$version" @probe
            if ($LASTEXITCODE -ne 0) { throw 'Package build failed' }
            New-Item -ItemType Directory -Path "$root\artifacts" -Force | Out-Null
            $compilerOutput = & 'C:\Program Files (x86)\NSIS\makensis.exe' '/V2' '/INPUTCHARSET' 'UTF8' "/DVersion=$version" "/DBundle=$root\package-$version" '/DChannel=synthetic' deploy/native/installer.nsi 2>&1
            $compilerExit = $LASTEXITCODE
            $compilerOutput | ForEach-Object { Write-Host $_ }
            if ($compilerExit -ne 0) { Write-Host ('::error::NSIS: '+($compilerOutput -join ' ')); throw 'Installer build failed' }
          }
          Get-ChildItem "$root\artifacts\*.exe" | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()+'  '+$_.Name } | Set-Content -Encoding ascii "$root\artifacts\SHA256SUMS.txt"
      - name: Actual synthetic EXE installation, services, update, recovery and uninstall
        shell: pwsh
        run: uv run python tests/native_windows/windows_smoke.py "$env:RUNNER_TEMP\gva-native"
      # No PR/push upload. This never publishes an official release. A fork can
      # edit its own CI; no resulting artefact is approved or signed by the company.
      - name: Retain unapproved synthetic installers after manual main execution only
        if: >-
          always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'MickaTDN/gestao-garrafas'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: UNAPPROVED-SYNTHETIC-UNSIGNED-NOT-FOR-DISTRIBUTION-${{ github.sha }}
          path: |
            ${{ runner.temp }}/gva-native/artifacts/*.exe
            ${{ runner.temp }}/gva-native/artifacts/SHA256SUMS.txt
          retention-days: 3
