name: Native Windows installer
on:
  push:
    branches: [stagec/windows-native-installer]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-native-synthetic:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install locked tools
        run: |
          python -m pip install uv==0.12.23
          uv sync --frozen
      - name: Fetch synthetic vendor inputs (never release trust)
        shell: powershell
        run: .\scripts\native\Prepare-TestInputs.ps1 -Directory "$env:RUNNER_TEMP\gva-native"
      - name: Synthetic signing authority (private key never uploaded)
        shell: pwsh
        run: |
          @'
          import json, os
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import ec
          root=Path(os.environ['RUNNER_TEMP'])/'gva-native'
          key=ec.generate_private_key(ec.SECP256R1())
          (root/'signing.pem').write_bytes(key.private_bytes(serialization.Encoding.PEM,serialization.PrivateFormat.PKCS8,serialization.NoEncryption()))
          (root/'policy.json').write_text(json.dumps({'channel':'synthetic','authenticode_sha256':None,'public_key':key.public_key().public_bytes(serialization.Encoding.PEM,serialization.PublicFormat.SubjectPublicKeyInfo).decode()}))
          '@ | uv run python -
      - name: Build initial and update packages; compile installer EXEs
        shell: pwsh
        run: |
          $root="$env:RUNNER_TEMP\gva-native"
          foreach ($version in @('1.0.0','1.1.0')) {
            uv run python scripts/native/build_package.py --version $version --minimum-version 1.0.0 --policy "$root\policy.json" --key "$root\signing.pem" --inputs "$root\inputs.json" --output "$root\package-$version"
            if ($LASTEXITCODE -ne 0) { throw 'Package build failed' }
            & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DVersion=$version" "/DBundle=$root\package-$version" '/DChannel=synthetic' deploy/native/installer.iss
            if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          }
          Get-ChildItem "$root\artifacts\*.exe" | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()+'  '+$_.Name } | Set-Content -Encoding ascii "$root\artifacts\SHA256SUMS.txt"
      - name: Actual synthetic EXE installation, services, update, recovery and uninstall
        shell: pwsh
        run: uv run python tests/native_windows/windows_smoke.py "$env:RUNNER_TEMP\gva-native"
      - name: Publish SYNTHETIC installers only (unsigned, non-production)
        uses: actions/upload-artifact@v4
        with:
          name: GVA-SYNTHETIC-UNSIGNED-NOT-FOR-PRODUCTION-${{ github.sha }}
          path: ${{ runner.temp }}/gva-native/artifacts/
          retention-days: 14
