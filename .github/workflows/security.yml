name: Security
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  workflow-and-dependency-security:
    name: workflow-and-dependency-security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install locked audit tools (no production secrets)
        run: |
          python -m pip install uv==0.12.23
          uv sync --frozen --group security
      - name: Check workflow policy and adversarial regression cases
        run: |
          uv run --frozen --group security python -m unittest discover -s tests/security -v
          uv run --frozen --group security python scripts/check_workflows.py
          uv run --frozen --group security zizmor --offline --persona auditor --min-severity informational --min-confidence low --no-ignores .github/workflows
      - name: Audit hashed runtime dependencies against current advisories
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/runtime-requirements.txt"
          uv run --frozen --group security pip-audit --disable-pip --no-deps --require-hashes --progress-spinner off --requirement "$RUNNER_TEMP/runtime-requirements.txt"
