name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  django-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .
      PG_TOOL_PREFIX: '["docker", "compose", "exec", "-T", "-e", "PGPASSWORD", "db"]'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install locked tools and dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --frozen
          python scripts/bootstrap.py
          uv run playwright install --with-deps chromium
          sudo apt-get install -y libnss3-tools
      - name: Start PostgreSQL
        run: docker compose up -d --wait db
      - name: Validate schema and application
        run: |
          uv run ruff check .
          uv run python scripts/build_vertente.py --check
          node --check vertente/assets/app.js
          node --check vertente/assets/domain.js
          node --check vertente/assets/store.js
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run
          uv run python manage.py migrate --noinput
          uv run python manage.py test accounts inventory imports web consultation tests.browser tests.windows.test_profile tests.vertente.browser tests.vertente.branding --noinput
          APP_ENV=production DJANGO_DEBUG=0 uv run python manage.py collectstatic --noinput
          APP_ENV=production DJANGO_DEBUG=0 uv run python manage.py check --deploy --fail-level WARNING
      - name: Validate prepared server image (no deployment)
        run: |
          docker build -f deploy/Dockerfile -t gestao-garrafas-ci .
          docker run --rm --read-only gestao-garrafas-ci pg_dump --version
          test "$(docker run --rm --read-only gestao-garrafas-ci id -u)" = "10001"
      - name: Windows local payload on isolated Linux containers
        run: uv run python tests/windows/smoke_stack.py --image gestao-garrafas-ci
      - name: Signed Stock export under the restricted application role
        run: uv run python tests/vertente/smoke_export.py --image gestao-garrafas-ci
      - name: Stock PWA trusted HTTPS and offline Android viewport
        run: uv run python tests/vertente/smoke_https.py
      - name: Stop services
        if: always()
        run: docker compose down

  windows-powershell:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Windows PowerShell 5.1 parsing, safeguards, NTFS and shortcuts (Docker mocked)
        shell: powershell
        run: |
          .\tests\windows\Test-Pilot.ps1
          .\tests\vertente\Test-Publisher.ps1
